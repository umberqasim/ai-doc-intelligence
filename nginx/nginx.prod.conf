events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # Rate limiting zone (defense in depth alongside slowapi in the app)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        client_max_body_size 20M;

        # API requests -> backend
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Needed for SSE streaming (chat streaming endpoint)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Health check and API docs -> backend
        location ~ ^/(health|docs|openapi.json|redoc) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Everything else -> frontend (React app)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
